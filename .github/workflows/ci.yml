name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      KEELMATRIX_NO_TELEMETRY: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install the pinned SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.425

      - name: Restore from controlled sources
        run: dotnet restore KeelMatrix.ConfigGap.sln --configfile NuGet.config --nologo

      - name: Build Release
        run: dotnet build KeelMatrix.ConfigGap.sln -c Release --no-restore --nologo

      - name: Test Release
        run: dotnet test KeelMatrix.ConfigGap.sln -c Release --no-build --no-restore --nologo

      - name: Pack the shipping package
        run: dotnet pack src/KeelMatrix.ConfigGap/KeelMatrix.ConfigGap.csproj -c Release --no-build --no-restore --include-symbols -p:SymbolPackageFormat=snupkg -o ./artifacts/packages --nologo

      - name: Inspect the package
        shell: pwsh
        run: >-
          pwsh -NoProfile -File ./scripts/Inspect-Package.ps1
          -PackagePath ./artifacts/packages/KeelMatrix.ConfigGap.0.1.0.nupkg
          -SymbolsPath ./artifacts/packages/KeelMatrix.ConfigGap.0.1.0.snupkg

      - name: Run package contract regression mutations
        shell: pwsh
        run: >-
          pwsh -NoProfile -File ./scripts/Test-PackageContract.ps1
          -PackagePath ./artifacts/packages/KeelMatrix.ConfigGap.0.1.0.nupkg
          -SymbolsPath ./artifacts/packages/KeelMatrix.ConfigGap.0.1.0.snupkg
          -ExpectedVersion 0.1.0

      - name: Test checked publication failure handling
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ReleasePublication.ps1

      - name: Run the clean package-consumer smoke
        shell: pwsh
        run: >-
          pwsh -NoProfile -File ./scripts/Invoke-PackageSmoke.ps1
          -PackagePath ./artifacts/packages/KeelMatrix.ConfigGap.0.1.0.nupkg

      - name: Run the Linux platform evidence check
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-PlatformMatrix.ps1
